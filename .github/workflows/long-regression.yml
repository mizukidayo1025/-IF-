# 手動実行の長時間・全件offline回帰suite。オフラインCIと同じく、Rustのkernel（native/）を
# 作って導入してから実行する。
name: 長時間simulation回帰

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 長時間simulation suiteまたはoffline test全件を選択
        required: true
        type: choice
        default: full
        options:
          - long
          - full

permissions:
  contents: read

jobs:
  long_simulation:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'long' }}
    runs-on: ubuntu-latest
    env:
      SHELTERSIM_LLM_MODE: offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: packageと開発toolを導入
        run: python -m pip install -e ".[dev]"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Rustのkernelを作って導入
        run: |
          rustup toolchain install stable --profile minimal
          python -m pip install "maturin>=1.7,<2"
          maturin build --release -m native/Cargo.toml --out native-dist
          python -m pip install --no-index --find-links native-dist sheltersim-native
          python -c "import sheltersim.native"
      - name: 長時間simulation回帰を実行
        run: python -m pytest -m long_simulation

  full_release_regression:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'full' }}
    runs-on: ubuntu-latest
    env:
      SHELTERSIM_LLM_MODE: offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: packageと開発toolを導入
        run: python -m pip install -e ".[dev]"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Rustのkernelを作って導入
        run: |
          rustup toolchain install stable --profile minimal
          python -m pip install "maturin>=1.7,<2"
          maturin build --release -m native/Cargo.toml --out native-dist
          python -m pip install --no-index --find-links native-dist sheltersim-native
          python -c "import sheltersim.native"
      - name: offline test全件を実行
        run: python -m pytest
