# ブラウザー版の静的サイトを作り、Cloudflare Workersの静的なファイルの配信へ公開する（#289）。
# 手で起動する（書き込み権限のある人なら誰でも）。公開するのはmainだけで、dry_runは
# どのbranchでもサイトを作ってwranglerの--dry-runまで行い、Cloudflareには何も送らない。
# 公開の後に、道ごとの答えと、ChromiumとFirefoxでの画面（static_site_e2e.py --url）を確かめる。
# 手順と設定はdocs/development.mdの「ブラウザー版の公開」。
name: ブラウザー版の公開

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: サイトを作ってwranglerの--dry-runまで（Cloudflareに送らない）
        type: boolean
        default: false

permissions:
  contents: read

# One deployment at a time; a newer one waits instead of cancelling a deployment half done.
concurrency:
  group: deploy-browser
  cancel-in-progress: false

env:
  SHELTERSIM_LLM_MODE: offline
  WRANGLER: wrangler@4.161.0
  SITE_URL: https://hinanjo-if.water7.workers.dev

jobs:
  deploy:
    name: build and deploy the browser site
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 公開できる条件か確認
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$DRY_RUN" = true ]; then exit 0; fi
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::only main is published ($GITHUB_REF); use dry_run on other branches"
            exit 1
          fi
          if [ "$HAS_TOKEN" != true ] || [ "$HAS_ACCOUNT" != true ]; then
            echo "::error::the secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: packageを導入
        run: python -m pip install -e .
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: deploy-browser
      # The sample's Scenario and minute 0 come from Python (scripts/build_browser_sample.py), which
      # needs the native kernel; the profile ci gives the same bytes as release (#217).
      - name: Rustのkernelを作って導入
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown
          python -m pip install "maturin>=1.7,<2"
          maturin build --profile ci -m native/Cargo.toml --out native-dist
          python -m pip install --no-index --find-links native-dist sheltersim-native
          python -c "import sheltersim.native"
      # The same wasm-bindgen as the lint job of ci.yml (the crate's version, checked by sha256).
      - name: WASMを作る
        run: |
          version=0.2.129
          archive=wasm-bindgen-$version-x86_64-unknown-linux-musl
          curl -sSfL -o "$RUNNER_TEMP/$archive.tar.gz" "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$version/$archive.tar.gz"
          echo "82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e  $RUNNER_TEMP/$archive.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/$archive.tar.gz" -C "$RUNNER_TEMP"
          cargo build --manifest-path native/Cargo.toml -p sheltersim_wasm --target wasm32-unknown-unknown --release
          wasm=native/target/wasm32-unknown-unknown/release/sheltersim_wasm.wasm
          "$RUNNER_TEMP/$archive/wasm-bindgen" --target nodejs --out-dir "$RUNNER_TEMP/wasm-pkg" "$wasm"
          "$RUNNER_TEMP/$archive/wasm-bindgen" --target web --out-dir "$RUNNER_TEMP/wasm-web" "$wasm"
      - name: 例のRunを作る
        run: python scripts/build_browser_sample.py "$RUNNER_TEMP/sample.shelterproj" --pkg "$RUNNER_TEMP/wasm-pkg"
      # The site is generated outside the repository (scripts/build_static_site.py refuses inside).
      - name: サイトを組み立てる
        run: |
          python scripts/build_static_site.py "$RUNNER_TEMP/site" --pkg "$RUNNER_TEMP/wasm-web" \
            --bundle "$RUNNER_TEMP/sample.shelterproj" --fetch-shelters > "$RUNNER_TEMP/site-build.json"
          cat "$RUNNER_TEMP/site-build.json"
      - name: wranglerで確かめる（送らない）
        run: npx --yes "$WRANGLER" deploy --config deploy/workers/wrangler.jsonc --assets "$RUNNER_TEMP/site" --dry-run
      - name: 公開する
        if: ${{ !inputs.dry_run }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes "$WRANGLER" deploy --config deploy/workers/wrangler.jsonc --assets "$RUNNER_TEMP/site" \
            --tag "${GITHUB_SHA::12}" --message "main ${GITHUB_SHA} (run ${GITHUB_RUN_ID})"
      # Each path answers as docs/development.md says, and the shelter index (which holds the time
      # the site was built) is this build's, so the check below sees the new version.
      - name: 公開した道の答えを確かめる
        if: ${{ !inputs.dry_run }}
        run: |
          fail=0
          check() {
            got=$(curl -s -o /dev/null -w "%{http_code} %{content_type} %{redirect_url}" "$SITE_URL$1")
            echo "$1 -> $got"
            case "$got" in "$2"*) ;; *) echo "::error::$1: expected $2, got $got"; fail=1 ;; esac
          }
          index=browser/gsi-shelter-index.json
          want=$(sha256sum "$RUNNER_TEMP/site/$index" | cut -d' ' -f1)
          for attempt in $(seq 1 30); do
            got=$(curl -s "$SITE_URL/$index" | sha256sum | cut -d' ' -f1)
            [ "$got" = "$want" ] && break
            sleep 10
          done
          if [ "$got" != "$want" ]; then echo "::error::$SITE_URL/$index is not this build's"; fail=1; fi
          check / "200 text/html"
          check /demo-v2 "200 text/html"
          check /demo-v2.html "307 "
          check /nope "404 text/html"
          check /browser/api_worker.mjs "200 text/javascript"
          check /browser/pkg/sheltersim_wasm_bg.wasm "200 application/wasm"
          check /sample/sample.json "200 application/json"
          rows=("$RUNNER_TEMP"/site/browser/gsi-shelters/*.json)
          check "/browser/gsi-shelters/${rows[0]##*/}" "200 application/json"
          exit $fail
      # Playwright is not a dependency of the project (docs/development.md); the version is the one
      # the checks were written with.
      - name: 公開したサイトを画面で確かめる（ChromiumとFirefox）
        if: ${{ !inputs.dry_run }}
        run: |
          python -m pip install "playwright==1.64.1"
          python -m playwright install --with-deps chromium firefox
          python benchmarks/static_site_e2e.py --url "$SITE_URL" \
            --output "$RUNNER_TEMP/e2e-url.json" --screenshots "$RUNNER_TEMP/e2e-url-shots"
      - name: 結果を保存
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: deploy-browser
          path: |
            ${{ runner.temp }}/site-build.json
            ${{ runner.temp }}/e2e-url.json
            ${{ runner.temp }}/e2e-url-shots/
          retention-days: 30
          if-no-files-found: ignore
