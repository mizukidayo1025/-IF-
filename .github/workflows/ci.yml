# offline CI on Linux, Windows and macOS (#48), on every pull request to main or
# feature/rust-port and by hand. Each OS builds and installs the Rust kernels (native/)
# and runs the tests with them. The Linux-only checks run as jobs of their own beside
# them: the tests without the kernels, the hashes of every path, and lint.
name: オフラインCI

on:
  pull_request:
    branches: [main, feature/rust-port]
  workflow_dispatch:

permissions:
  contents: read

# A newer run on the same branch or PR replaces an older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SHELTERSIM_LLM_MODE: offline

jobs:
  python:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Every platform reports, even when another fails.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: packageと開発toolを導入
        run: python -m pip install -e ".[dev]"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Rustのkernelを作って導入
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          python -m pip install "maturin>=1.7,<2"
          maturin build --release -m native/Cargo.toml --out native-dist
          python -m pip install --no-index --find-links native-dist sheltersim-native
          python -c "import sheltersim.native as n; assert n.available(), 'kernels not loaded'"
      - name: 短時間offline test
        run: python -m pytest -m "not long_simulation" -n auto
      - name: test結果を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: .test-results/
          retention-days: 7
          if-no-files-found: ignore
          # .test-results is a dot directory, which upload-artifact skips by default.
          include-hidden-files: true

  python-without-native:
    name: test without Rust (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      SHELTERSIM_NATIVE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: packageと開発toolを導入
        run: python -m pip install -e ".[dev]"
      - name: Rustのkernelなしで短時間offline test
        run: python -m pytest -m "not long_simulation" -n auto
      - name: test結果を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-without-native
          path: .test-results/
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true

  gate:
    name: hashes of every path (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: packageと開発toolを導入
        run: python -m pip install -e ".[dev]"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Rustのkernelを作って導入
        run: |
          rustup toolchain install stable --profile minimal
          python -m pip install "maturin>=1.7,<2"
          maturin build --release -m native/Cargo.toml --out native-dist
          python -m pip install --no-index --find-links native-dist sheltersim-native
          python -c "import sheltersim.native as n; assert n.available(), 'kernels not loaded'"
      - name: 全経路のハッシュを確認
        run: python benchmarks/gate_all_paths.py --output "$RUNNER_TEMP/gate" --expect fixtures/gate-all-paths.json

  lint:
    name: lint (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: packageと開発toolを導入
        run: python -m pip install -e ".[dev]"
      - name: lintを確認
        run: ruff check .
      - name: formatを確認
        run: ruff format --check .
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: clippy
      - name: Rustの禁止メソッドを確認
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          cargo clippy --manifest-path native/Cargo.toml -- -A clippy::all -D clippy::disallowed_methods
