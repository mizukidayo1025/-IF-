# offline CI on Linux, Windows and macOS (#48), on every pull request to main and
# by hand. Each OS builds and installs the Rust kernels (native/), runs the tests with
# them and checks the hashes of every path against the same fixture: on Linux in a job
# of its own beside the tests, on Windows and macOS as a step after the tests of the
# first part. Each OS runs its tests in two jobs, half each (pytest --shard, #118). The
# test jobs build with the profile ci, the Linux gate job with release (#217). Lint runs
# on Linux only.
name: オフラインCI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer run on the same branch or PR replaces an older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SHELTERSIM_LLM_MODE: offline

jobs:
  python:
    name: test (${{ matrix.os }}, ${{ matrix.shard }}/2)
    runs-on: ${{ matrix.os }}
    strategy:
      # Every platform and part reports, even when another fails.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # The tests are CPU-bound on a runner's cores, so two runners halve them; each part
        # takes every other selected test (tests/conftest.py).
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: packageと開発toolを導入
        run: python -m pip install -e ".[dev]"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      # The profile ci of native/Cargo.toml builds much sooner than release and gives the same
      # bytes (#217). The gate job below keeps --release, so every PR still checks the hashes of
      # the build that is shipped.
      - name: Rustのkernelを作って導入
        id: native
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          python -m pip install "maturin>=1.7,<2"
          maturin build --profile ci -m native/Cargo.toml --out native-dist
          python -m pip install --no-index --find-links native-dist sheltersim-native
          python -c "import sheltersim.native"
      - name: 短時間offline test
        run: python -m pytest -m "not long_simulation" -n auto --shard ${{ matrix.shard }}/2
      # The same expected hashes as on Linux, where the gate job checks them (step 4, L13): a Run
      # gives the same bytes on every OS. Runs even when a test failed, so both report; in the
      # first part only.
      - name: 全経路のハッシュを確認
        id: gate
        if: ${{ runner.os != 'Linux' && matrix.shard == 1 && !cancelled() && steps.native.outcome == 'success' }}
        shell: bash
        run: python benchmarks/gate_all_paths.py --output "$RUNNER_TEMP/gate" --expect fixtures/gate-all-paths.json
      - name: test結果を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.shard }}
          path: .test-results/
          retention-days: 7
          if-no-files-found: ignore
          # .test-results is a dot directory, which upload-artifact skips by default.
          include-hidden-files: true
      - name: 全経路のハッシュを保存
        if: ${{ !cancelled() && steps.gate.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: gate-${{ matrix.os }}
          path: ${{ runner.temp }}/gate/summary.json
          retention-days: 7
          if-no-files-found: ignore

  gate:
    name: hashes of every path (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: packageと開発toolを導入
        run: python -m pip install -e ".[dev]"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Rustのkernelを作って導入
        run: |
          rustup toolchain install stable --profile minimal
          python -m pip install "maturin>=1.7,<2"
          maturin build --release -m native/Cargo.toml --out native-dist
          python -m pip install --no-index --find-links native-dist sheltersim-native
          python -c "import sheltersim.native"
      - name: 全経路のハッシュを確認
        run: python benchmarks/gate_all_paths.py --output "$RUNNER_TEMP/gate" --expect fixtures/gate-all-paths.json

  lint:
    name: lint (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: packageと開発toolを導入
        run: python -m pip install -e ".[dev]"
      - name: lintを確認
        run: ruff check .
      - name: formatを確認
        run: ruff format --check .
      # The PyO3 crate's rules files hold only glue, and the deleted Python rules stay deleted
      # (#152, design-p9.md section 6): each finding that stays is listed with its reason.
      - name: Rustの窓口の規則がglueだけか確認
        run: python benchmarks/rust_port/glue_check.py
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: clippy
      - name: Rustの禁止メソッドを確認
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          cargo clippy --manifest-path native/Cargo.toml --workspace -- -A clippy::all -D clippy::disallowed_methods
      # The core crate builds without Python (#152): no pyo3 in its tree, and its own tests pass.
      - name: Rustの中核がPyO3なしで動くことを確認
        run: |
          if cargo tree --manifest-path native/Cargo.toml -p sheltersim_core -e normal,build | grep -q pyo3; then
            echo "sheltersim_core depends on pyo3" >&2
            exit 1
          fi
          cargo test --manifest-path native/Cargo.toml -p sheltersim_core
      # Without the feature `parallel` (rayon) the core runs on the calling thread with the same
      # bytes and builds for the browser (#152, P10-1a). tests/no_platform.rs, run in both, finds
      # any std::time, fs, env or thread in its source.
      - name: Rustの中核がwasm32向けに作れ、1つのthreadで同じ結果になることを確認
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --manifest-path native/Cargo.toml -p sheltersim_core --target wasm32-unknown-unknown --no-default-features
          cargo test --manifest-path native/Cargo.toml -p sheltersim_core --no-default-features
      # The core runs in WASM through wasm-bindgen and reaches the native path's digests (#244,
      # PR 4-4): the CLI's version must be the crate's (`native/wasm/Cargo.toml`), and the release
      # archive is checked against its sha256.
      - name: Rustの中核がWASMでネイティブと同じdigestになることを確認
        run: |
          version=0.2.129
          archive=wasm-bindgen-$version-x86_64-unknown-linux-musl
          curl -sSfL -o "$RUNNER_TEMP/$archive.tar.gz" "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$version/$archive.tar.gz"
          echo "82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e  $RUNNER_TEMP/$archive.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/$archive.tar.gz" -C "$RUNNER_TEMP"
          cargo build --manifest-path native/Cargo.toml -p sheltersim_wasm --target wasm32-unknown-unknown --profile ci
          "$RUNNER_TEMP/$archive/wasm-bindgen" --target nodejs --out-dir "$RUNNER_TEMP/pkg" native/target/wasm32-unknown-unknown/ci/sheltersim_wasm.wasm
          node native/wasm/tests/node_digests.mjs "$RUNNER_TEMP/pkg"
          node native/wasm/tests/node_frames.mjs "$RUNNER_TEMP/pkg"
          node native/wasm/tests/node_saved_points.mjs "$RUNNER_TEMP/pkg"
          node native/wasm/tests/node_project_store.mjs "$RUNNER_TEMP/pkg"
