[package]
name = "sheltersim_native"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[lib]
name = "sheltersim_native"
crate-type = ["cdylib"]

[workspace]
members = [".", "core"]

[workspace.lints.clippy]
# A loop over a HashMap or HashSet goes in an order that changes from process to process. Each one
# left is allowed where it is, with why its order reaches no result (docs/rust-port/step4-plan.md 9).
iter_over_hash_type = "deny"

[dependencies]
sheltersim_core = { path = "core" }
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py312"] }
indexmap = "2"
itoa = "1"
rayon = "1.10"
rustc-hash = "2"
smallvec = "1"
sha2 = "0.10"
serde_json = { version = "1.0", features = ["arbitrary_precision"] }

[lints]
workspace = true

[profile.release]
lto = true
codegen-units = 1
