[package]
name = "sheltersim_native"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[lib]
name = "sheltersim_native"
crate-type = ["cdylib"]

[workspace]
members = [".", "core"]

[workspace.lints.clippy]
# A loop over a HashMap or HashSet goes in an order that changes from process to process. Each one
# left is allowed where it is, with why its order reaches no result (docs/rust-port/step4-plan.md 9).
iter_over_hash_type = "deny"

[dependencies]
# The kernels use the core's helper threads: its default feature `parallel`, named here so that
# the wrapper keeps it whatever the core's defaults become.
sheltersim_core = { path = "core", features = ["parallel"] }
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py312"] }
indexmap = "2"
itoa = "1"
rayon = "1.10"
rustc-hash = "2"
smallvec = "1"
sha2 = "0.10"
serde_json = { version = "1.0", features = ["arbitrary_precision"] }

[lints]
workspace = true

[profile.release]
lto = true
codegen-units = 1

# The offline CI's test jobs build with this profile (Issue #217): the same optimization level
# as release, but thin LTO and 16 codegen units, so the two crates of the workspace build much
# sooner, and the tests take as long as with release. The bytes of a Run do not depend on it
# (the hashes of every path are the same). The CI's gate job, the long regression, deploy/vm
# and the build in docs/development.md keep --release.
[profile.ci]
inherits = "release"
lto = "thin"
codegen-units = 16
