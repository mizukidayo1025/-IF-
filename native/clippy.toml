# Run with `cargo clippy --manifest-path native/Cargo.toml -- -D clippy::disallowed_methods`.
# Float results must be the same bits on every OS, and dict order must never move.
disallowed-methods = [
    { path = "f64::exp", reason = "use core::mathx::exp: the pinned libm crate, the same bits on every OS" },
    { path = "f64::exp_m1", reason = "use core::mathx::expm1: the pinned libm crate, the same bits on every OS" },
    { path = "f64::powf", reason = "use core::mathx::pow: the pinned libm crate, the same bits on every OS" },
    { path = "f64::powi", reason = "use core::mathx::pow; powi is not correctly rounded and LLVM may rewrite it" },
    { path = "f64::mul_add", reason = "use core::mathx::fma; mul_add calls the platform's fma where the CPU has none" },
    { path = "f64::hypot", reason = "use core::mathx::hypot, CPython's own algorithm" },
    { path = "f64::max", reason = "use core::mathx::py_max: first argument on a tie, NaN as Python" },
    { path = "f64::min", reason = "use core::mathx::py_min: first argument on a tie, NaN as Python" },
    { path = "f64::clamp", reason = "keeps -0.0 and panics on NaN bounds; use py_min(hi, py_max(lo, x))" },
    { path = "f64::round", reason = "rounds ties away from zero; use core::mathx::py_round or py_round_int" },
    { path = "std::vec::Vec::swap_remove", reason = "moves the last element; order must stay Python's" },
    { path = "indexmap::IndexMap::swap_remove", reason = "use shift_remove; dict order must stay Python's" },
    { path = "indexmap::IndexMap::swap_remove_entry", reason = "use shift_remove_entry" },
    { path = "indexmap::IndexMap::swap_remove_full", reason = "use shift_remove_full" },
    { path = "indexmap::IndexMap::swap_remove_index", reason = "use shift_remove_index" },
    { path = "indexmap::IndexMap::remove", reason = "this is swap_remove; use shift_remove" },
    { path = "indexmap::IndexMap::remove_entry", reason = "this is swap_remove_entry; use shift_remove_entry" },
]
