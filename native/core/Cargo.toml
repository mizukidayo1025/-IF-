[package]
name = "sheltersim_core"
version = "0.1.0"
edition = "2021"
publish = false
description = "The simulation core of 避難所IF！ without Python (Issue #152): no pyo3 dependency."

[lib]
crate-type = ["rlib"]

[dependencies]
indexmap = "2"
itoa = "1"
# Pure Rust exp, expm1, pow and fma: the same bits on every OS (docs/rust-port/step4-plan.md, section 9).
libm = "=0.2.16"
# The per-person compute and the Checkpoint kernels on more than one thread (`parallel.rs`,
# `checkpoint.rs`). Without the `parallel` feature they run on the calling thread, in the same
# order, with the same bytes: the wasm32 build (`--no-default-features`).
rayon = { version = "1.10", optional = true }
rustc-hash = "2"
ryu = "1.0"
# The number text of a saved record as it was read: a float keeps its digits (`events/log.rs`).
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
sha2 = "0.10"

[features]
default = ["parallel"]
parallel = ["dep:rayon"]

[lints]
workspace = true
